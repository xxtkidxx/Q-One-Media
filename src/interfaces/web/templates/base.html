<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · Q One Media</title>
<style>
  /* Brand NMI: navy #081120, Inter + IBM Plex Mono (theo nmi.vn).
     Không framework CSS và KHÔNG JavaScript nào: form POST + redirect làm đủ mọi
     việc ở đây. Hệ quả có giá trị thật cho một công cụ on-prem: trang chạy được
     khi nhà máy không có internet ra ngoài. Font cũng vậy — dùng stack hệ thống,
     không gọi Google Fonts. */
  :root {
    --navy:      #081120;
    --navy-soft: #0f1c33;
    --line:      #1e2c46;
    --ink:       #e8edf6;
    --ink-dim:   #93a2bd;
    --accent:    #4d9fff;
    --ok:        #2fbf71;
    --warn:      #e8a33d;
    --bad:       #e0525f;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--navy);
    color: var(--ink);
    font: 15px/1.55 "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  code, .mono, td.num {
    font-family: "IBM Plex Mono", "Consolas", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; align-items: baseline; gap: 24px;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
    background: var(--navy-soft);
  }
  header .brand { font-weight: 700; letter-spacing: .02em; }
  header nav { display: flex; gap: 18px; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  .sub { color: var(--ink-dim); font-size: 13px; margin: 0 0 20px; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tile {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; background: var(--navy-soft);
  }
  .tile .n { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .k { color: var(--ink-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .tile.zero .n { color: var(--ink-dim); font-weight: 400; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .scroll { overflow-x: auto; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  tr:hover td { background: rgba(77,159,255,.05); }

  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 99px;
    font-size: 12px; border: 1px solid var(--line);
  }
  .pill.ok   { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .pill.bad  { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 45%, transparent); }

  form.card, .card {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; background: var(--navy-soft); margin: 14px 0;
  }
  label { display: block; font-size: 13px; color: var(--ink-dim); margin: 10px 0 3px; }
  input[type=text], input[type=url], select, textarea {
    width: 100%; padding: 7px 9px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--navy); color: var(--ink);
    font: inherit;
  }
  textarea { min-height: 64px; resize: vertical; }
  .row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .checks { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-top: 8px; }
  .checks label { display: flex; align-items: center; gap: 7px; color: var(--ink); margin: 0; font-size: 14px; }
  input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }

  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 8px 16px; border-radius: 4px; border: 1px solid var(--line);
    background: var(--accent); color: #041021;
  }
  button.ghost { background: transparent; color: var(--ink); }
  button.danger { background: var(--bad); color: #2a0508; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

  .note {
    border-left: 3px solid var(--warn); padding: 8px 12px; margin: 14px 0;
    background: rgba(232,163,61,.08); font-size: 14px;
  }
  .note.legal { border-left-color: var(--bad); background: rgba(224,82,95,.08); }
  video { width: 100%; max-width: 420px; border-radius: var(--radius); background: #000; }
  .empty { color: var(--ink-dim); padding: 18px 0; }
</style>
</head>
<body>
<header>
  <span class="brand">Q One Media</span>
  <nav>
    <a href="/web">Bảng điều khiển</a>
    <a href="/web/sources">Nguồn</a>
    <a href="/web/review">Chờ duyệt</a>
    <a href="/docs">API</a>
  </nav>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
