<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · Q One Media</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--navy:#0b1739;--navy2:#13234b;--ink:#17213a;--muted:#69758d;--line:#e3e8f1;--blue:#246bfd;--cyan:#15aabf;--green:#16a36a;--amber:#dc8b13;--red:#dc4056;--shadow:0 8px 30px rgba(25,42,80,.08);--r:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}code,.mono,.num{font-family:"Cascadia Code",Consolas,monospace;font-variant-numeric:tabular-nums}header{height:64px;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;padding:0 28px;gap:42px;position:sticky;top:0;z-index:20;box-shadow:0 2px 15px #07112b33}.brand{font-size:18px;font-weight:800;letter-spacing:.02em}.brand i{color:#69a4ff;font-style:normal}nav{display:flex;height:100%;align-items:center;gap:6px}nav a{color:#aebbd7;padding:10px 14px;border-radius:8px;font-weight:600}nav a:hover{color:#fff;background:#ffffff12;text-decoration:none}main{max-width:1440px;margin:auto;padding:28px 28px 70px}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}h1{font-size:27px;line-height:1.2;margin:0 0 7px;letter-spacing:-.025em}h2{font-size:18px;margin:25px 0 12px}h3{font-size:15px;margin:0}.sub{color:var(--muted);margin:0;font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:14px 0}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.metric{position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-34px;top:-35px;background:var(--metric,#246bfd);opacity:.1}.metric .n{font-size:31px;font-weight:800;line-height:1.15}.metric .k{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.metric .trend{margin-top:8px;color:var(--metric,#246bfd);font-size:12px;font-weight:600}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar .search{flex:1;min-width:250px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tag,.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--muted)}.tag.active{background:#eaf1ff;border-color:#b9d0ff;color:var(--blue)}.pill.approved,.pill.ok,.pill.published{background:#e9f9f2;color:var(--green);border-color:#bcebd7}.pill.pending,.pill.warn,.pill.transcript_review,.pill.human_review,.pill.transcript_approved{background:#fff6e4;color:var(--amber);border-color:#f3dbad}.pill.failed,.pill.rejected,.pill.bad,.pill.license_blocked{background:#ffedf0;color:var(--red);border-color:#f7c4cc}.pill.running,.pill.segment_picked,.pill.scripted,.pill.voiced,.pill.aligned,.pill.rendered,.pill.downloaded,.pill.separated,.pill.transcribed{background:#eaf1ff;color:var(--blue);border-color:#c8d9ff}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d6ddea;border-radius:9px;background:#fff;color:var(--ink);font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #246bfd18}textarea{min-height:88px;resize:vertical}label{display:block;color:var(--muted);font-size:12px;font-weight:650;margin:10px 0 5px}.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.checks{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:14px 0}.checks label{display:flex;align-items:center;gap:7px;margin:0;color:var(--ink)}input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:9px;padding:10px 15px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}.btn:hover,button:hover{filter:brightness(.96);text-decoration:none}.ghost{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important}.danger{background:var(--red)!important}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.055em;background:#f8faff}tbody tr:hover>td{background:#f9fbff}.source-row{cursor:pointer}.source-name{font-weight:750;font-size:14px}.avatar{width:36px;height:36px;border-radius:10px;background:#eaf1ff;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-weight:800;margin-right:10px}.source-cell{display:flex;align-items:center}.detail-row>td{padding:0;background:#f8faff}.source-detail{padding:18px}.detail-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);gap:16px}.detail-stack{display:block}.item{border:1px solid var(--line);border-radius:11px;padding:14px;margin:10px 0;background:#fff}.item-top{display:flex;justify-content:space-between;gap:12px}.progress{height:7px;background:#e8edf5;border-radius:9px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:9px}.timeline{border-left:2px solid #dce4f2;margin:12px 0 0 8px;padding-left:17px}.event{position:relative;padding:0 0 13px}.event:before{content:"";position:absolute;width:8px;height:8px;background:var(--blue);border:3px solid #eaf1ff;border-radius:50%;left:-23px;top:4px}.event time{display:block;color:var(--muted);font-size:11px}.note{padding:11px 13px;border-radius:9px;background:#fff7e8;border:1px solid #f5deae;color:#80560f;margin:12px 0}.legal{background:#fff0f2;border-color:#f5c8cf;color:#923042}.empty{text-align:center;color:var(--muted);padding:28px}.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:15px}.modal{border:0;border-radius:16px;padding:0;width:min(760px,calc(100% - 30px));box-shadow:0 25px 80px #07112b55}.modal::backdrop{background:#07112b99;backdrop-filter:blur(3px)}.modal-inner{padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:transparent!important;color:var(--muted)!important;font-size:22px;padding:4px 8px}.tabbar{margin:18px 0 0;gap:8px}.tabbar button{background:#fff;color:var(--muted);border:1px solid var(--line);font-size:12px;font-weight:700;border-radius:99px;padding:8px 14px}.tabbar button.active{background:#eaf1ff;border-color:#b9d0ff;color:var(--blue)}.tabbar button .pill{padding:2px 7px;font-size:10px}
.workflow{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 4px;margin-top:6px}.wf-step{flex:0 0 auto;min-width:104px;max-width:132px;text-align:center;padding:9px 7px;border:1px solid var(--line);border-radius:10px;background:#fff;position:relative}.wf-step+.wf-step:before{content:"";position:absolute;left:-7px;top:50%;width:7px;height:2px;background:var(--line)}.wf-dot{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:50%;background:#eef2f9;color:var(--muted);font-weight:800;font-size:11px}.wf-label{display:block;font-size:11px;font-weight:650;margin-top:6px;line-height:1.3}.wf-pct{display:block;font-size:11px;color:var(--muted);margin-top:3px}.clip-summary{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:10px}.clip-row-link{cursor:pointer}.clip-row-link:hover>td{background:#f2f6ff}.history-branch{border-left:3px solid #dce4f2;padding-left:14px;margin:16px 0 0}.history-branch .timeline{margin-top:8px}.history-branch+.history-branch{border-top:1px dashed var(--line);padding-top:14px}.modal video{max-width:100%}
.clip-row{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end;margin:8px 0}.clip-row .clip-end{display:flex;align-items:center;gap:6px;padding-bottom:9px}.clip-row [data-clip-length]{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}.clip-bad{color:var(--red)!important;font-weight:700}.bar-chart{display:flex;align-items:flex-end;height:175px;gap:8px;padding-top:20px}.bar-col{flex:1;text-align:center;min-width:35px}.bar{background:linear-gradient(180deg,#5f94ff,var(--blue));border-radius:7px 7px 2px 2px;min-height:3px}.bar-label{font-size:10px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis}.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}video{width:100%;max-width:420px;background:#000;border-radius:10px}@media(max-width:850px){header{padding:0 14px;gap:12px}nav a{padding:8px;font-size:12px}main{padding:20px 14px}.detail-grid,.two-col{grid-template-columns:1fr}.hide-mobile{display:none}.page-head{flex-direction:column}.clip-row{grid-template-columns:1fr 1fr}}
.subtitle-layout{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(520px,1.4fr);gap:16px;margin-top:14px}.subtitle-player{position:sticky;top:82px;align-self:start;background:#081120;border-radius:12px;padding:10px;overflow:hidden}.subtitle-player video{display:block;max-width:none;width:100%;max-height:55vh}.subtitle-preview{position:absolute;left:8%;right:8%;bottom:52px;text-align:center;color:#fff;font-size:18px;font-weight:750;text-shadow:0 2px 5px #000,0 0 2px #000;background:#0008;border-radius:5px;padding:5px 9px;min-height:34px}.player-time{color:#d9e5ff;text-align:center;padding-top:8px}.subtitle-timeline{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.subtitle-timeline th{position:sticky;top:0;z-index:2}.subtitle-row.active td{background:#eaf1ff}.subtitle-row textarea{min-height:64px}.time-fields{display:grid;grid-template-columns:1fr 1fr;gap:5px;min-width:170px}.time-fields input{padding:7px}.play-line{padding:6px 9px;margin-top:5px;font-size:11px}.subtitle-actions{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}.subtitle-actions label{margin:0;min-width:200px}.subtitle-actions label input{margin-top:5px}@media(max-width:1000px){.subtitle-layout{grid-template-columns:1fr}.subtitle-player{position:relative;top:auto}.subtitle-timeline{max-height:none}}
.subtitle-timeline table{table-layout:fixed}.subtitle-timeline th:nth-child(1){width:42px}.subtitle-timeline th:nth-child(2){width:180px}.subtitle-timeline th:nth-child(4){width:78px}.time-fields{grid-template-columns:1fr 1fr;min-width:0}.time-fields input{padding:7px 6px;font-size:12px}.subtitle-row textarea{width:100%;min-height:76px}.subtitle-row-actions{display:flex;align-items:center;justify-content:flex-end;gap:3px}.subtitle-row-actions .play-line{margin:0;padding:6px 9px;font-size:13px}
.toast-stack{position:fixed;right:22px;top:82px;z-index:100;display:grid;gap:10px;width:min(430px,calc(100vw - 28px));pointer-events:none}.toast{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:13px 14px;border:1px solid;border-radius:11px;background:#fff;box-shadow:0 14px 40px #07112b2b;pointer-events:auto;animation:toast-in .2s ease-out}.toast.success{border-color:#a9e2ca;color:#08794b;background:#f0fbf6}.toast.error{border-color:#f2b8c1;color:#a1263a;background:#fff2f4}.toast button{flex:0 0 auto;padding:0 3px;background:transparent;color:currentColor;font-size:20px;line-height:1}@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}@media(max-width:600px){.toast-stack{top:72px;right:14px}}
</style></head><body><header><div class="brand">Q <i>One</i> Media</div><nav><a href="/web">Tổng quan</a><a href="/web/sources">Nguồn & nội dung</a><a href="/docs">API</a></nav></header><main>{% block body %}{% endblock %}</main>
<script>function subtitleEditorFor(element){return element.closest('[data-subtitle-editor]')}function playSubtitleRow(button){const row=button.closest('.subtitle-row'),editor=subtitleEditorFor(button),video=editor.querySelector('video'),start=Number(row.querySelector('[name="start"]').value),end=Number(row.querySelector('[name="end"]').value);video.currentTime=start;video.dataset.stopAt=String(end);video.play()}function removeSubtitleRow(button){button.closest('.subtitle-row').remove();renumberSubtitleRows(subtitleEditorFor(button))}function renumberSubtitleRows(editor){editor.querySelectorAll('.subtitle-row').forEach((row,index)=>row.firstElementChild.textContent=String(index+1))}function addSubtitleRow(form){const body=form.querySelector('[data-subtitle-rows]'),rows=body.querySelectorAll('.subtitle-row'),last=rows[rows.length-1],start=last?Number(last.querySelector('[name="end"]').value):0,row=document.createElement('tr');row.className='subtitle-row';row.innerHTML=`<td class="num"></td><td><div class="time-fields"><input type="number" name="start" step="0.01" min="0" value="${start.toFixed(2)}"><input type="number" name="end" step="0.01" min="0" value="${(start+2).toFixed(2)}"></div><button type="button" class="ghost play-line" onclick="playSubtitleRow(this)">▶ Phát đoạn</button></td><td><textarea name="text_line"></textarea></td><td><button type="button" class="close" onclick="removeSubtitleRow(this)">×</button></td>`;body.appendChild(row);renumberSubtitleRows(form);row.querySelector('textarea').focus()}function formatPlayerTime(seconds){const minutes=Math.floor(seconds/60),secs=(seconds%60).toFixed(3).padStart(6,'0');return `${String(minutes).padStart(2,'0')}:${secs}`}document.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('[data-subtitle-editor]').forEach(editor=>{const video=editor.querySelector('video'),preview=editor.querySelector('[data-subtitle-preview]'),clock=editor.querySelector('[data-player-time]');video.addEventListener('timeupdate',()=>{clock.textContent=formatPlayerTime(video.currentTime);if(video.dataset.stopAt&&video.currentTime>=Number(video.dataset.stopAt)){video.pause();delete video.dataset.stopAt}let active=null;for(const row of editor.querySelectorAll('.subtitle-row')){const start=Number(row.querySelector('[name="start"]').value),end=Number(row.querySelector('[name="end"]').value),isActive=video.currentTime>=start&&video.currentTime<=end;row.classList.toggle('active',isActive);if(isActive&&!active)active=row}preview.textContent=active?active.querySelector('[name="text_line"]').value:''})}));</script>
<script>function addSubtitleRow(form){const body=form.querySelector('[data-subtitle-rows]'),rows=body.querySelectorAll('.subtitle-row'),last=rows[rows.length-1],start=last?Number(last.querySelector('[name="end"]').value):0,row=document.createElement('tr');row.className='subtitle-row';row.innerHTML=`<td class="num"></td><td><div class="time-fields"><input type="number" name="start" step="0.01" min="0" value="${start.toFixed(2)}"><input type="number" name="end" step="0.01" min="0" value="${(start+2).toFixed(2)}"></div></td><td><textarea name="text_line"></textarea></td><td><div class="subtitle-row-actions"><button type="button" class="ghost play-line" title="Phát đoạn" aria-label="Phát đoạn" onclick="playSubtitleRow(this)">▶</button><button type="button" class="close" aria-label="Xóa dòng" onclick="removeSubtitleRow(this)">×</button></div></td>`;body.appendChild(row);renumberSubtitleRows(form);row.querySelector('textarea').focus()}document.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('.toast').forEach(toast=>setTimeout(()=>toast.remove(),6000)))</script>
<script>function toggleDetail(id){const e=document.getElementById(id);e.hidden=!e.hidden}
function openClipDialog(id){const dialog=document.getElementById('clip-'+id);if(dialog)dialog.showModal()}
// Tab của trang review: mỗi panel là một section server-rendered, JS chỉ ẩn/hiện.
// Tab đang mở nằm trong hash để F5 hay mở lại link không nhảy về tab mặc định.
function showReviewTab(name){const panels=[...document.querySelectorAll('[data-tab-panel]')];if(!panels.some(p=>p.dataset.tabPanel===name))name=panels.length?panels[0].dataset.tabPanel:'';panels.forEach(p=>p.hidden=p.dataset.tabPanel!==name);document.querySelectorAll('[data-tab-button]').forEach(b=>b.classList.toggle('active',b.dataset.tabButton===name));try{history.replaceState(null,'','#'+name)}catch(_){}}
document.addEventListener('DOMContentLoaded',()=>{const bar=document.querySelector('.tabbar');if(bar)showReviewTab(location.hash.slice(1)||bar.dataset.defaultTab)});function addClip(btn){const b=btn.closest('form').querySelector('.clip-list'),n=b.children.length+1,r=document.createElement('div');r.className='clip-row';r.innerHTML=`<div><label>Clip ${n} · Bắt đầu (giây)</label><input type="number" step="0.1" min="0" name="start_sec" required></div><div><label>Kết thúc (giây)</label><input type="number" step="0.1" min="0" name="end_sec" required></div><span class="clip-end"><span class="sub" data-clip-length>—</span><button type="button" class="close" title="Bỏ đoạn" onclick="this.closest('.clip-row').remove()">×</button></span>`;b.appendChild(r)}
// Độ dài đoạn hiện ngay khi gõ: biên 10–180 giây là bất biến của domain, biết
// trước khi bấm thì hơn là bấm xong mới bị từ chối.
function updateClipLength(row){const list=row.closest('.clip-list'),out=row.querySelector('[data-clip-length]');if(!list||!out)return;const start=Number(row.querySelector('[name="start_sec"]').value),end=Number(row.querySelector('[name="end_sec"]').value),len=end-start,min=Number(list.dataset.segMin||0),max=Number(list.dataset.segMax||0);out.textContent=len>0?`${len.toFixed(1)}s`:'—';out.className='sub'+(len>0&&(len<min||len>max)?' clip-bad':'')}
document.addEventListener('input',event=>{const row=event.target.closest&&event.target.closest('.clip-row');if(row)updateClipLength(row)});// Hai nút, hai việc: "Nạp video" tạo nguồn mới, "Upload file" nạp thêm vào nguồn đã có.
function openUpload(){document.getElementById('uploadModal').showModal()}
function openRowUpload(sourceId,label){const modal=document.getElementById('rowUploadModal');modal.querySelector('[data-row-upload-form]').action=`/web/sources/${sourceId}/uploads`;modal.querySelector('[data-row-upload-label]').textContent=`#${sourceId} · ${label}`;modal.showModal()}function suggestApproval(form){const type=form.license_type.value,name=form.dataset.sourceName,url=form.dataset.sourceUrl,rights=['may_translate','may_modify_audio','may_subtitle','may_republish','may_commercial_use'],help=form.querySelector('.approval-help');rights.forEach(n=>form.elements[n].checked=false);if(type==='cc-by'||type==='own')rights.forEach(n=>form.elements[n].checked=true);if(type==='cc-by')form.attribution_text.value=`Nguồn: ${name} · ${url} · CC BY`;else if(type==='own')form.attribution_text.value='';if(type==='cc-by')help.textContent='Đã gợi ý quyền theo CC BY và chuỗi ghi nguồn.';else if(type==='own')help.textContent='Đã gợi ý đầy đủ quyền cho nội dung NMI sở hữu.';else help.textContent='Giấy phép riêng: chỉ tick đúng các quyền bạn có.'}// Trang nguồn chỉ hiện video gốc; clip con gộp thành thống kê nên phải gộp lại
// từ snapshot mỗi lần polling, nếu không nó đứng im cho tới khi F5.
function updateClipSummaries(items){const boxes=document.querySelectorAll('[data-clip-summary]');if(!boxes.length)return;const byParent={};for(const state of items){if(!state.parent_item_id)continue;(byParent[state.parent_item_id]=byParent[state.parent_item_id]||[]).push(state)}boxes.forEach(box=>{const kids=byParent[box.dataset.clipSummary];if(!kids||!kids.length)return;const counts={};kids.forEach(kid=>{counts[kid.stage]=counts[kid.stage]||{n:0,label:kid.label};counts[kid.stage].n++});box.innerHTML=`<strong>${kids.length} clip con</strong>`+Object.entries(counts).map(([stage,info])=>`<span class="pill ${stage}">${info.n} · ${info.label}</span>`).join('')})}
async function refreshItemStatus(){try{const response=await fetch('/web/item-status',{cache:'no-store'});if(!response.ok)return;const data=await response.json(),actionable=['transcript_review','transcript_approved','human_review'];updateClipSummaries(data.items);for(const state of data.items){const card=document.querySelector(`[data-item-id="${state.id}"]`);if(!card)continue;const old=card.dataset.stage,badge=card.querySelector('[data-live-stage]'),bar=card.querySelector('[data-live-progress]'),label=card.querySelector('[data-live-progress-label]'),error=card.querySelector('[data-live-error]');
// Badge hiện nhãn tiếng Việt; mã enum chỉ còn là class CSS. Mọi phần tử đều có
// thể vắng mặt: trang video gốc cố tình không có thanh %, vì con số đó sai.
if(badge){badge.textContent=state.stage_label||state.stage;badge.className=`pill ${state.stage}`}
if(bar)bar.style.width=`${state.progress}%`;
if(label)label.textContent=`Bước ${state.step}/${state.total_steps} · ${state.progress}% · ${state.label}`;
if(error){error.textContent=state.error||'';error.hidden=!state.error}
card.dataset.stage=state.stage;if(old!==state.stage&&actionable.includes(state.stage)){if(document.querySelector('[data-subtitle-editor][data-dirty]'))continue;
// Tới gate mới thì mở đúng tab của việc mới: bỏ hash để server chọn tab mặc định.
if(onReview)try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}
if(onSources)sessionStorage.setItem('qone-open',JSON.stringify([...document.querySelectorAll('.source-detail:not([hidden])')].map(e=>e.id)));location.reload();return}}}catch(_){}}
const onSources=location.pathname==='/web/sources',onReview=/^\/web\/review\/\d+$/.test(location.pathname);
if(onSources){try{for(const id of JSON.parse(sessionStorage.getItem('qone-open')||'[]')){const e=document.getElementById(id);if(e)e.hidden=false}}catch(_){}sessionStorage.removeItem('qone-open')}
// Reload khi tới gate cần người thao tác là để form mới hiện ra — nhưng nếu người
// dùng đang sửa dở transcript thì reload là mất việc họ vừa gõ.
document.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('[data-subtitle-editor]').forEach(form=>form.addEventListener('input',()=>form.dataset.dirty='1',{once:true})));
if(onSources||onReview)setInterval(refreshItemStatus,3000);</script></body></html>
