{% extends "base.html" %}
{% block body %}
<h1>{{ title }}</h1>
<div class="toast-stack" aria-live="assertive"><div class="toast error"><div><strong>{{ title }}</strong><br>{{ detail }}</div><button type="button" onclick="this.parentElement.remove()">×</button></div></div>
{% if hint %}<p class="sub">{{ hint }}</p>{% endif %}
<div class="actions">
  <a href=""><button class="ghost" type="button">Về bảng điều khiển</button></a>
  <a href="/sources"><button class="ghost" type="button">Quản lý nguồn</button></a>
</div>
{% endblock %}
