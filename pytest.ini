[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers -m "not gpu and not external and not integration"
markers =
    gpu: can GPU thuc (khong chay mac dinh)
    external: goi API ben ngoai - YouTube/Facebook/LLM (khong chay mac dinh)
    integration: can container dang chay
