# Q One Media — compose gốc (dùng chung dev/prod)
# Không chạy file này một mình. Luôn kèm override:
#   dev : -f docker/docker-compose.yml -f docker/docker-compose.dev.yml  --env-file .env.dev
#   prod: -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env.prod
#
# Mọi state nằm trong ./data/${APP_ENV}/ dưới dạng bind mount — KHÔNG dùng docker volume.
# Xoá container/image không mất dữ liệu. Xoá ./data là mất.

name: qone-media-${APP_ENV}

x-common-env: &common-env
  APP_ENV: ${APP_ENV}
  TZ: ${TZ:-Asia/Ho_Chi_Minh}
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  MEDIA_ROOT: /data/media
  MODEL_CACHE: /models
  HF_HOME: /models/huggingface
  TORCH_HOME: /models/torch

  # ---- Nghiệp vụ ----
  # Mọi biến container cần dùng PHẢI khai ở đây: --env-file chỉ thay biến trong
  # chính file compose, không tự truyền vào container. Thiếu một dòng ở đây là
  # code đọc ra None và một guard nổ giữa đường.
  TTS_ENGINE: ${TTS_ENGINE:-voxcpm}
  TTS_SYLLABLES_PER_SEC: ${TTS_SYLLABLES_PER_SEC:-}
  VOXCPM_VOICE_REF: ${VOXCPM_VOICE_REF:-}
  FPTAI_API_KEY: ${FPTAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
  LLM_MODEL_HARD: ${LLM_MODEL_HARD:-claude-opus-5}
  PUBLISH_ENABLED: ${PUBLISH_ENABLED:-false}
  YOUTUBE_CLIENT_SECRET_FILE: ${YOUTUBE_CLIENT_SECRET_FILE:-}
  YOUTUBE_TOKEN_FILE: ${YOUTUBE_TOKEN_FILE:-}
  FB_PAGE_ID: ${FB_PAGE_ID:-}
  FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN:-}
  WEB_USER: ${WEB_USER:-}
  WEB_PASSWORD: ${WEB_PASSWORD:-}
  API_PORT: ${API_PORT:-8000}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Giữ initdb ổn định giữa các máy
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ../data/${APP_ENV}/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - ../data/${APP_ENV}/media:/data/media
      - ../data/${APP_ENV}/logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /healthz (liveness), KHÔNG phải /readyz: readyz gọi DB, nên postgres chậm
      # một nhịp là api bị coi là chết. Và /healthz luôn mở dù có basic auth.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Worker GPU: yt-dlp, WhisperX, Demucs, VoxCPM2, ffmpeg, script VideoLingo/Easel
  worker:
    build:
      context: ..
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    volumes:
      - ../data/${APP_ENV}/media:/data/media
      - ../data/${APP_ENV}/logs:/data/logs
      # Model dùng chung dev/prod — artifact bất biến, không phải state,
      # và tải lại rất lâu (~10 GB).
      - ../data/models:/models
    depends_on:
      postgres:
        condition: service_healthy
    # GPU: cần NVIDIA Container Toolkit (Windows: Docker Desktop + WSL2).
    # Không có GPU thì đặt GPU_COUNT=0 trong .env — worker chạy CPU, chậm.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      GENERIC_TIMEZONE: ${TZ:-Asia/Ho_Chi_Minh}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      QONE_API_BASE: http://api:8000
    volumes:
      - ../data/${APP_ENV}/n8n:/home/node/.n8n
      - ../data/${APP_ENV}/media:/data/media:ro
    depends_on:
      postgres:
        condition: service_healthy
