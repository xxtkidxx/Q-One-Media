# DEV override — code mount từ host, hot reload, port mở ra localhost
# Dùng: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml --env-file .env.dev up -d

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-55432}:5432"

  api:
    build:
      target: dev
    # Mount code để sửa là thấy ngay, không rebuild
    volumes:
      - ../src:/app/src
      - ../vendor:/app/vendor
      - ../tests:/app/tests
      # pytest.ini phai co trong container, khong thi --strict-markers
      # khong chay va marker gpu/external/integration bi coi la loi chinh ta
      - ../pytest.ini:/app/pytest.ini:ro
      - ../ruff.toml:/app/ruff.toml:ro
      - ../scripts:/app/scripts:ro
      - ../research:/app/research:ro
      - ../alembic:/app/alembic
      - ../alembic.ini:/app/alembic.ini:ro
      - ../data/dev/media:/data/media
      - ../data/dev/logs:/data/logs
    environment:
      LOG_LEVEL: DEBUG
      RELOAD: "true"
    command: uvicorn src.interfaces.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      target: dev
    volumes:
      - ../src:/app/src
      - ../vendor:/app/vendor
      - ../tests:/app/tests
      # pytest.ini phai co trong container, khong thi --strict-markers
      # khong chay va marker gpu/external/integration bi coi la loi chinh ta
      - ../pytest.ini:/app/pytest.ini:ro
      - ../ruff.toml:/app/ruff.toml:ro
      - ../scripts:/app/scripts:ro
      - ../research:/app/research:ro
      - ../alembic:/app/alembic
      - ../alembic.ini:/app/alembic.ini:ro
      - ../data/dev/media:/data/media
      - ../data/dev/logs:/data/logs
      - ../data/models:/models
    environment:
      LOG_LEVEL: DEBUG

  n8n:
    environment:
      N8N_LOG_LEVEL: debug
      N8N_SECURE_COOKIE: "false"
    ports:
      - "${N8N_PORT:-5678}:5678"
