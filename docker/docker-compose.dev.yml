# Q One Media — DEV. File này chạy độc lập, không cần override nào khác.
#
#   docker compose -f docker/docker-compose.dev.yml --env-file .env.dev up -d
#   (hoặc dùng make: dev-up, dev-down, dev-logs, test, smoke, migrate …)
#
# Khác prod ở bốn điểm: code mount từ host (sửa là thấy ngay), port mở ra
# localhost, log DEBUG, và n8n không đặt mật khẩu.
#
# Mọi state nằm trong ./data/dev/ dưới dạng **bind mount**, không dùng docker
# volume. Xoá container hay image không mất gì; xoá ./data/dev là mất.

name: qone-media-dev

# ============================================================
# Biến môi trường truyền vào container.
#
# Mọi biến code cần dùng PHẢI khai ở đây: --env-file chỉ thay biến trong chính
# file compose, KHÔNG tự truyền vào container. Thiếu một dòng là code đọc ra
# None và một guard nổ giữa đường (đã xảy ra với TTS_SYLLABLES_PER_SEC).
# ============================================================
x-env: &env
  APP_ENV: dev
  TZ: ${TZ:-Asia/Ho_Chi_Minh}
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  MEDIA_ROOT: /data/media
  MODEL_CACHE: /models
  HF_HOME: /models/huggingface
  TORCH_HOME: /models/torch

  # ---- Nghiệp vụ ----
  TTS_ENGINE: ${TTS_ENGINE:-voxcpm}
  TTS_SYLLABLES_PER_SEC: ${TTS_SYLLABLES_PER_SEC:-}
  VOXCPM_VOICE_REF: ${VOXCPM_VOICE_REF:-}
  VOXCPM_VOICE_REF_TEXT: ${VOXCPM_VOICE_REF_TEXT:-}
  FPTAI_API_KEY: ${FPTAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
  LLM_MODEL_HARD: ${LLM_MODEL_HARD:-claude-opus-5}
  PUBLISH_ENABLED: ${PUBLISH_ENABLED:-false}
  YOUTUBE_CLIENT_SECRET_FILE: ${YOUTUBE_CLIENT_SECRET_FILE:-}
  YOUTUBE_TOKEN_FILE: ${YOUTUBE_TOKEN_FILE:-}
  FB_PAGE_ID: ${FB_PAGE_ID:-}
  FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN:-}
  WEB_USER: ${WEB_USER:-}
  WEB_PASSWORD: ${WEB_PASSWORD:-}
  API_PORT: ${API_PORT:-8000}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"   # initdb ổn định giữa các máy
    volumes:
      - ../data/dev/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      <<: *env
    # Mount code để sửa là thấy ngay. Viết thẳng ở cả api và worker vì YAML merge
    # key chỉ hoạt động với mapping, không splice được anchor vào list.
    # pytest.ini và ruff.toml phải có trong container, nếu không thì
    # --strict-markers không chạy và marker gpu/external/integration bị coi là
    # lỗi chính tả.
    volumes:
      - ../src:/app/src
      - ../vendor:/app/vendor
      - ../tests:/app/tests
      - ../scripts:/app/scripts:ro
      - ../research:/app/research:ro
      - ../alembic:/app/alembic
      - ../alembic.ini:/app/alembic.ini:ro
      - ../pytest.ini:/app/pytest.ini:ro
      - ../ruff.toml:/app/ruff.toml:ro
      - ../data/dev/media:/data/media
      - ../data/dev/logs:/data/logs
    command: uvicorn src.interfaces.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /healthz (liveness), KHÔNG /readyz: readyz gọi DB nên postgres chậm một
      # nhịp là api bị coi là chết. /healthz cũng luôn mở dù có basic auth.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Worker GPU: yt-dlp, WhisperX, Demucs, VoxCPM2, ffmpeg, script Easel
  worker:
    build:
      context: ..
      dockerfile: docker/worker/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      <<: *env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    volumes:
      - ../src:/app/src
      - ../vendor:/app/vendor
      - ../tests:/app/tests
      - ../scripts:/app/scripts:ro
      - ../research:/app/research:ro
      - ../alembic:/app/alembic
      - ../alembic.ini:/app/alembic.ini:ro
      - ../pytest.ini:/app/pytest.ini:ro
      - ../ruff.toml:/app/ruff.toml:ro
      - ../data/dev/media:/data/media
      - ../data/dev/logs:/data/logs
      # Model dùng chung dev/prod — artifact bất biến, không phải state, và tải
      # lại rất lâu (~10 GB).
      - ../data/models:/models
    depends_on:
      postgres:
        condition: service_healthy
    # GPU: cần NVIDIA Container Toolkit (Windows: Docker Desktop + WSL2).
    # Không có GPU thì đặt GPU_COUNT=0 trong .env.dev — worker chạy CPU, rất chậm.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      GENERIC_TIMEZONE: ${TZ:-Asia/Ho_Chi_Minh}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_LOG_LEVEL: debug
      N8N_SECURE_COOKIE: "false"   # dev chạy http, cookie secure sẽ không gửi được
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n      # schema riêng, không lẫn với bảng app
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      QONE_API_BASE: http://api:8000
    volumes:
      - ../data/dev/n8n:/home/node/.n8n
      - ../data/dev/media:/data/media:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    depends_on:
      postgres:
        condition: service_healthy
